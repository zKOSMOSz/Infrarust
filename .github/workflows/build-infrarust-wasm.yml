name: Build Infrarust (wasm)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-infrarust-wasm.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: infrarust-linux-x86_64-wasm
            binary: infrarust
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: infrarust-windows-x86_64-wasm
            binary: infrarust.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout upstream Infrarust
        uses: actions/checkout@v4
        with:
          repository: Shadowner/Infrarust
          ref: main

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Patch sha2 0.11 hex formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/infrarust-loader-wasm/src/cache.rs")
          text = p.read_text()
          old = 'format!("{:x}", hasher.finalize())'
          new = 'hasher.finalize().iter().map(|b| format!("{:02x}", b)).collect::<String>()'
          if old not in text:
              raise SystemExit("patch target not found — upstream may have fixed this")
          p.write_text(text.replace(old, new, 1))
          print("patched OK")
          PY

      - name: Build release with wasm
        run: cargo build --release -p infrarust --features wasm --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          DST="dist/${{ matrix.artifact_name }}"
          cp "$SRC" "$DST"
          chmod +x "$DST" || true
          "$DST" --version || true
          tar -C dist -czf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}"
          ls -lh dist/ "${{ matrix.artifact_name }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error
          retention-days: 14
